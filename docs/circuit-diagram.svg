<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-labelledby="title desc">
  <title id="title">Bare-metal soil moisture controller circuit diagram</title>
  <desc id="desc">Arduino Uno ATmega328P reads a soil moisture sensor analog output on A0 and drives a relay module input from D8. The relay's normally-open contact switches a separate DC supply to a water pump.</desc>
  <defs>
    <style>
      .bg{fill:#f5f7fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.board{fill:#e8f1f7;stroke:#256b83;stroke-width:3}.module{fill:#f8fafc;stroke:#64748b;stroke-width:2.5}.title{font:700 34px Arial,sans-serif;fill:#102a43}.subtitle{font:16px Arial,sans-serif;fill:#526477}.h{font:700 21px Arial,sans-serif;fill:#102a43}.label{font:16px Arial,sans-serif;fill:#243b53}.small{font:14px Arial,sans-serif;fill:#526477}.pin{font:700 15px Arial,sans-serif;fill:#102a43}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#dc4444}.black{stroke:#273746}.teal{stroke:#0f8b8d}.orange{stroke:#df821b}.violet{stroke:#7654b7}.green{stroke:#2b8a62}.terminal{fill:#fff;stroke:#334e68;stroke-width:2}.chip{fill:#153e52;stroke:#0b2533;stroke-width:2}.white{fill:#fff;font:700 19px Arial,sans-serif}.callout{fill:#fff7e6;stroke:#e5a93d;stroke-width:2}.callouttext{font:15px Arial,sans-serif;fill:#694b12}
    </style>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc4444"/></marker>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#273746"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f8b8d"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#df821b"/></marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7654b7"/></marker>
  </defs>
  <rect class="bg" width="1680" height="1040" rx="24"/>
  <text class="title" x="70" y="72">Bare-Metal Soil Moisture Controller</text>
  <text class="subtitle" x="70" y="104">Conceptual wiring for the ATmega328P firmware in this repository • Arduino Uno pin mapping</text>

  <!-- Arduino Uno -->
  <rect class="board" x="70" y="235" width="360" height="520" rx="22"/>
  <text class="h" x="105" y="280">ARDUINO UNO</text>
  <text class="small" x="105" y="307">ATmega328P • 16 MHz</text>
  <rect class="chip" x="145" y="365" width="210" height="190" rx="14"/>
  <text class="white" x="250" y="437" text-anchor="middle">ATmega</text>
  <text class="white" x="250" y="466" text-anchor="middle">328P</text>
  <text class="small" x="110" y="620">Firmware uses AVR registers</text>
  <text class="small" x="110" y="645">and an explicit main() loop</text>
  <text class="pin" x="105" y="370">5V</text><circle cx="430" cy="360" r="7" fill="#dc4444"/>
  <text class="pin" x="105" y="430">GND</text><circle cx="430" cy="420" r="7" fill="#273746"/>
  <text class="pin" x="105" y="600">A0 / ADC0</text><circle cx="430" cy="590" r="7" fill="#0f8b8d"/>
  <text class="pin" x="105" y="690">D8 / PB0</text><circle cx="430" cy="680" r="7" fill="#df821b"/>
  <text class="small" x="105" y="720">A0 = PC0 / ADC channel 0</text>
  <text class="small" x="105" y="742">D8 = PB0 relay output</text>

  <!-- Sensor module -->
  <rect class="module" x="670" y="135" width="360" height="210" rx="18"/>
  <text class="h" x="700" y="178">SOIL MOISTURE SENSOR</text>
  <text class="small" x="700" y="204">Analog-output module</text>
  <rect x="800" y="220" width="175" height="88" rx="12" fill="#dcefe8" stroke="#2b8a62" stroke-width="2"/>
  <path d="M820 284 C840 252 860 252 880 284 S920 316 950 260" fill="none" stroke="#2b8a62" stroke-width="4"/>
  <circle class="terminal" cx="670" cy="230" r="7"/><text class="pin" x="690" y="236">VCC</text>
  <circle class="terminal" cx="670" cy="280" r="7"/><text class="pin" x="690" y="286">GND</text>
  <circle class="terminal" cx="670" cy="330" r="7"/><text class="pin" x="690" y="336">AO</text>

  <!-- Relay module -->
  <rect class="module" x="670" y="500" width="480" height="310" rx="18"/>
  <text class="h" x="700" y="545">1-CHANNEL RELAY MODULE</text>
  <text class="small" x="700" y="570">Logic input side (low voltage)</text>
  <circle class="terminal" cx="670" cy="610" r="7"/><text class="pin" x="690" y="616">VCC</text>
  <circle class="terminal" cx="670" cy="665" r="7"/><text class="pin" x="690" y="671">GND</text>
  <circle class="terminal" cx="670" cy="720" r="7"/><text class="pin" x="690" y="726">IN</text>
  <rect x="800" y="595" width="125" height="132" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text class="small" x="862" y="625" text-anchor="middle">Relay coil</text>
  <path d="M825 650 h75 m-75 12 h75 m-75 12 h75 m-75 12 h75" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M925 660 h36" stroke="#64748b" stroke-width="3"/>
  <text class="small" x="862" y="705" text-anchor="middle">Switch</text>
  <text class="small" x="960" y="605">Contact terminals</text>
  <circle class="terminal" cx="1020" cy="650" r="8"/><text class="pin" x="1040" y="656">COM</text>
  <circle class="terminal" cx="1020" cy="705" r="8"/><text class="pin" x="1040" y="711">NO</text>
  <circle class="terminal" cx="1020" cy="755" r="8"/><text class="pin" x="1040" y="761">NC</text>
  <text class="small" x="700" y="775">Confirm relay board is active-high and check its rated voltage/current.</text>

  <!-- External supply and pump -->
  <rect class="panel" x="1260" y="375" width="330" height="170" rx="18"/>
  <text class="h" x="1290" y="420">SEPARATE DC SUPPLY</text>
  <text class="small" x="1290" y="448">Choose voltage for your pump</text>
  <circle cx="1260" cy="485" r="8" fill="#dc4444"/><text class="pin" x="1280" y="491">+V</text>
  <circle cx="1260" cy="520" r="8" fill="#273746"/><text class="pin" x="1280" y="526">0V / −</text>
  <rect class="panel" x="1260" y="680" width="330" height="155" rx="18"/>
  <text class="h" x="1290" y="725">DC WATER PUMP</text>
  <text class="small" x="1290" y="751">Pump is powered through relay contacts</text>
  <circle cx="1260" cy="785" r="8" fill="#7654b7"/><text class="pin" x="1280" y="791">Pump +</text>
  <circle cx="1260" cy="815" r="8" fill="#273746"/><text class="pin" x="1280" y="821">Pump −</text>

  <!-- Low-voltage wiring -->
  <path class="wire red" d="M430 360 H520 V230 H670"/>
  <path class="wire red" d="M520 360 V610 H670"/>
  <path class="wire black" d="M430 420 H570 V280 H670"/>
  <path class="wire black" d="M570 420 V665 H670"/>
  <path class="wire teal" d="M430 590 H610 V330 H670"/>
  <path class="wire orange" d="M430 680 H640 V720 H670"/>

  <!-- Load wiring: separate supply through relay COM and NO -->
  <path class="wire red" d="M1260 485 H1195 V650 H1028" marker-end="url(#arrowRed)"/>
  <path class="wire violet" d="M1028 705 H1195 V785 H1260" marker-end="url(#arrowViolet)"/>
  <path class="wire black" d="M1260 815 H1215 V520 H1260" opacity="0"/>
  <path class="wire black" d="M1260 815 H1225 V520 H1260" opacity="0"/>
  <!-- Return path, visually routed below the two load blocks -->
  <path class="wire black" d="M1260 815 H1215 V900 H1600 V520 H1260" marker-end="url(#arrowBlack)"/>

  <!-- Labels for wires -->
  <rect x="475" y="320" width="74" height="28" rx="8" fill="#fff" stroke="#dc4444"/><text class="small" x="512" y="339" text-anchor="middle">5V</text>
  <rect x="525" y="445" width="82" height="28" rx="8" fill="#fff" stroke="#273746"/><text class="small" x="566" y="464" text-anchor="middle">GND</text>
  <rect x="480" y="555" width="92" height="28" rx="8" fill="#fff" stroke="#0f8b8d"/><text class="small" x="526" y="574" text-anchor="middle">A0 / AO</text>
  <rect x="480" y="645" width="100" height="28" rx="8" fill="#fff" stroke="#df821b"/><text class="small" x="530" y="664" text-anchor="middle">D8 / IN</text>

  <!-- Footer notes -->
  <rect class="callout" x="70" y="875" width="1090" height="105" rx="14"/>
  <text class="callouttext" x="95" y="910">Control rule in src/main.c: ADC reading &lt; 500 → PB0/D8 HIGH; otherwise LOW.</text>
  <text class="callouttext" x="95" y="940">Calibrate the sensor to confirm that this threshold means “dry” for your module.</text>
  <text class="callouttext" x="95" y="965">Never power the pump from an Arduino I/O pin. Use a correctly rated relay and separate pump supply.</text>
</svg>